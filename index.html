<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ur-Astro</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0e1116; color: #e0e7ef; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 360px; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: #96a1b0; margin: 0 0 20px; font-size: 14px; }
  a { display: block; padding: 14px 16px; margin: 0 0 10px; border: 1px solid #2a3340;
      border-radius: 10px; color: #e0e7ef; text-decoration: none; background: #161b22; }
  a b { display: block; }
  a span { color: #96a1b0; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Ur-Astro</h1>
  <p id="note">แอปย้ายไปอยู่คนละโฟลเดอร์แล้ว — กำลังพาไปแอปยูเรเนียน …</p>
  <a href="uranian/"><b>ยูเรเนียนออฟไลน์</b><span>ghostzips.github.io/Ur-Astro/uranian/</span></a>
  <a href="map/"><b>แผนที่ดวง</b><span>ghostzips.github.io/Ur-Astro/map/</span></a>
</main>
<script>
// ถอน service worker รุ่นเก่าที่ขอบเขตราก (แอปยูเรเนียนก่อน v133) แล้วพาไปแอปยูเรเนียน
// ไม่แตะ worker ของ uranian/ และ map/ · เปิด ?stay ไว้ดูหน้านี้โดยไม่ถูกพาไป
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const root = new URL("./", location.href).href;
      for (const r of await navigator.serviceWorker.getRegistrations())
        if (r.scope === root) await r.unregister();
    }
  } catch (e) { /* ไม่มีสิทธิ์/ไม่รองรับ — ไปต่อได้ */ }
  if (!/[?&]stay\b/.test(location.search)) location.replace("uranian/");
  else document.getElementById("note").textContent = "เลือกแอป";
})();
</script>
</body>
</html>
